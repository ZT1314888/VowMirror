server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location ~ ^/web/(app\.mjs|foundation\.css|image-core\.mjs|response-core\.mjs|sse-core\.mjs)$ {
        types { application/javascript mjs; text/css css; }
        try_files $uri =404;
    }
    location /api/ {
        # Reject oversized uploads here: early upstream closes can become proxy 502s.
        client_max_body_size 24m;
        error_page 413 = @request_too_large;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 95s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
    }
    location @request_too_large {
        default_type application/json;
        # An unfinished upload cannot be reused for the next keep-alive request.
        keepalive_timeout 0;
        # Local add_header directives replace inherited headers in Nginx 1.28.
        include /etc/nginx/security-headers.conf;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        return 413 '{"code":41301,"message":"上传内容过大，请压缩图片后重试","data":{"error_code":"REQUEST_TOO_LARGE","request_id":"$request_id"}}';
    }
    location / { return 404; }
}
