# The proxy rewrite removes /api/ before the limit and error-response phases.
map $uri $entry_retry_after {
    default "";
    ~^/tryon/authorize/?$ 2;
    ~^/tryon/couple/?$ 3;
    ~^/catalog/outfits/?$ 1;
}
limit_req_zone $binary_remote_addr zone=authorize_entry:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=couple_entry:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=catalog_entry:10m rate=120r/m;

# Cache policy lives in one map keyed by exact URI. Match operators are compared literally,
# so this works without the PCRE-dependent rewrite module.
map $uri $static_cache_control {
    default "";
    "/" "no-cache";
    "/index.html" "no-cache";
    "/web/public/manifest.json" "no-cache";
    "/web/app.mjs" "no-cache";
    "/web/foundation.css" "no-cache";
    "/web/image-core.mjs" "no-cache";
    "/web/response-core.mjs" "no-cache";
    "/web/sse-core.mjs" "no-cache";
    "/web/particle-core.mjs" "no-cache";
    "/web/petal-core.mjs" "no-cache";
    "/web/public/fonts/cg-var-latin.woff2" "public, max-age=31536000, immutable";
    "/web/public/fonts/cg-italic-latin.woff2" "public, max-age=31536000, immutable";
    "/web/public/fonts/noto-serif-sc-400.woff2" "public, max-age=31536000, immutable";
    "/web/public/fonts/noto-serif-sc-600.woff2" "public, max-age=31536000, immutable";
    # Venue previews follow the outfit previews: content hashed in web/public/manifest.json.
    "~^/web/public/venues/V00[1-7](-thumb)?\.webp$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Cache policy lives in one map; security headers are a separate snippet so a location
    # that restates it for its own add_header never has to copy the whole header set.
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $static_cache_control always;

    # Mutable entry files must be revalidated together after local frontend updates.
    location = / { include /etc/nginx/security-headers.conf; add_header Cache-Control $static_cache_control always; try_files /index.html =404; }
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control $static_cache_control always; try_files $uri =404; }
    location = /web/public/manifest.json { include /etc/nginx/security-headers.conf; add_header Cache-Control $static_cache_control always; try_files $uri =404; }
    location = /web/public/invitation-opening-petals.mp3 {
        types { audio/mpeg mp3; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    # OUTFIT_ID_PATTERN in web/app.mjs and scripts/verify-wedding-assets.mjs repeats this
    # expression; tests/wedding-assets.test.mjs fails if the copies drift apart.
    location ~ ^/web/public/outfits/W0(0[1-9]|[12][0-9]|30)(-thumb)?\.webp$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    # VENUE_ID_PATTERN in web/app.mjs, scripts/verify-wedding-assets.mjs and the .dockerignore
    # venue rules repeat this expression; tests/public-assets.test.mjs fails if they drift apart.
    location ~ ^/web/public/venues/V00[1-7](-thumb)?\.webp$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location ~ ^/web/public/(wedding-example|florals)\.jpg$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location ~ ^/web/public/fonts/(cg-var-latin|cg-italic-latin|noto-serif-sc-400|noto-serif-sc-600)\.woff2$ {
        types { font/woff2 woff2; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    location ~ ^/web/(app\.mjs|foundation\.css|image-core\.mjs|response-core\.mjs|sse-core\.mjs|particle-core\.mjs|petal-core\.mjs)$ {
        types { application/javascript mjs; text/css css; }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }
    # One zone per route keeps Nginx's check and accounting under the same lock.
    location ~ ^/api/tryon/authorize/?$ {
        limit_req zone=authorize_entry burst=4 nodelay;
        include /etc/nginx/api-proxy.conf;
    }
    location ~ ^/api/tryon/couple/?$ {
        limit_req zone=couple_entry burst=3 nodelay;
        include /etc/nginx/api-proxy.conf;
    }
    location ~ ^/api/catalog/outfits/?$ {
        limit_req zone=catalog_entry burst=19 nodelay;
        include /etc/nginx/api-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }
    location @entry_rate_limited {
        default_type application/json;
        include /etc/nginx/security-headers.conf;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control no-store always;
        add_header Retry-After $entry_retry_after always;
        return 429 '{"code":42901,"message":"请求过于频繁，请稍后再试","data":{"error_code":"RATE_LIMITED","request_id":"$request_id"}}';
    }
    location @request_too_large {
        default_type application/json;
        # An unfinished upload cannot be reused for the next keep-alive request.
        keepalive_timeout 0;
        # Local add_header directives replace inherited headers in Nginx 1.28.
        include /etc/nginx/security-headers.conf;
        add_header X-Request-ID $request_id always;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":41301,"message":"上传内容过大，请压缩图片后重试","data":{"error_code":"REQUEST_TOO_LARGE","request_id":"$request_id"}}';
    }
    location / { return 404; }
}
