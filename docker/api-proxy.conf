limit_req_status 429;
error_page 429 = @entry_rate_limited;
# Reject oversized uploads here: early upstream closes can become proxy 502s.
client_max_body_size 24m;
error_page 413 = @request_too_large;
# Regex locations require a proxy_pass without a URI; strip the prefix explicitly.
rewrite ^/api/(.*)$ /$1 break;
proxy_pass http://backend_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
# The real-IP module trusts only Cloudflare peers; discard all client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
proxy_redirect off;
proxy_read_timeout 95s;
proxy_request_buffering off;
proxy_buffering off;
proxy_cache off;
proxy_max_temp_file_size 0;
