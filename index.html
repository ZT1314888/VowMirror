<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf8f5">
  <title>VowMirror · 提前看见你们的婚礼模样</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="/web/public/fonts/cg-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/web/public/fonts/noto-serif-sc-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/web/foundation.css">
  <script type="module" src="/web/app.mjs"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/><path d="m8 10 4 4 4-4"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M7 17H5a4 4 0 0 1-.5-8A7.5 7.5 0 0 1 19 8.2a4.5 4.5 0 0 1 0 8.8h-2M12 20V10m-4 4 4-4 4 4"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7ZM21 2v5m-2.5-2.5h5"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/></symbol>
    <symbol id="icon-compare" viewBox="0 0 24 24"><path d="M12 3v18M8 8l-4 4 4 4M16 8l4 4-4 4"/></symbol>
  </defs></svg>

  <!-- 全屏环境背景：双缓冲交叉淡入 + 象牙薄纱 + 胶片颗粒 -->
  <div class="ambient-layer" aria-hidden="true">
    <img id="ambient-bg-a" class="ambient-img" alt="">
    <img id="ambient-bg-b" class="ambient-img is-on" alt="">
  </div>
  <div class="ambient-scrim" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <!-- 隐藏的文件选择入口 -->
  <input id="couple-image" name="couple-image" type="file" accept="image/png,image/jpeg,image/webp" class="file-input-proxy" tabindex="-1" aria-hidden="true">
  <input id="scene-image" name="scene-image" type="file" accept="image/png,image/jpeg,image/webp" class="file-input-proxy" tabindex="-1" aria-hidden="true">

  <main id="invitation-screen" class="invitation-screen" aria-labelledby="invitation-title">
    <div class="invitation-content">
      <p class="invitation-kicker">A LITTLE INVITATION</p>
      <h1 id="invitation-title">为你们珍藏的，一份婚礼灵感</h1>
      <div class="envelope-art">
        <div class="envelope-back" aria-hidden="true"></div>
        <div class="letter-paper" aria-hidden="true"><span>VowMirror</span><i>FOR YOUR FOREVER</i></div>
        <div class="envelope-flap" aria-hidden="true"></div>
        <div class="envelope-front" aria-hidden="true"><span>V</span></div>
        <button id="open-invitation" class="wax-seal" type="button" aria-label="轻启请柬，进入婚礼照片创作"><svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span>轻启请柬</span></button>
      </div>
      <p class="invitation-hint">点击火漆，开启你们的婚礼灵感</p>
      <span class="invitation-ornament" aria-hidden="true">❋</span>
    </div>
  </main>

  <main id="experience" class="experience-gallery" hidden>
    <header class="gallery-header">
      <button id="gallery-wordmark" class="wordmark" type="button" aria-label="回到第一步">VowMirror</button>
      <nav id="header-stepper" class="header-stepper" aria-label="创作步骤"></nav>
      <div class="header-actions">
        <div class="service-state" data-state="pending"><span class="state-dot" aria-hidden="true"></span><span id="health-status" class="sr-only" role="status" aria-live="polite">正在检查服务</span></div>
      </div>
    </header>

    <div id="form-alert" class="form-alert" role="alert" tabindex="-1" hidden></div>

    <div id="gallery-viewport" class="gallery-viewport">
      <div id="gallery-track" class="gallery-track">
        <section id="room-photo" class="gallery-room" aria-label="01 合照">
          <h2 class="room-title sr-only" id="room-photo-title" tabindex="-1">01 合照</h2>
          <div id="photo-frame" class="hero-frame">
            <div id="room-photo-content" class="room-fill"></div>
            <div id="photo-scan-beam" class="scan-beam" aria-hidden="true"></div>
          </div>
        </section>
        <section id="room-outfit" class="gallery-room" aria-label="02 造型">
          <h2 class="room-title sr-only" id="room-outfit-title" tabindex="-1">02 造型</h2>
          <div class="hero-frame">
            <div id="outfit-hero-a" class="hero-layer"></div>
            <div id="outfit-hero-b" class="hero-layer is-front"></div>
            <canvas id="outfit-particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>
          </div>
        </section>
        <section id="room-scene" class="gallery-room" aria-label="03 场景">
          <h2 class="room-title sr-only" id="room-scene-title" tabindex="-1">03 场景</h2>
          <div class="hero-frame">
            <div id="scene-hero-a" class="hero-layer"></div>
            <div id="scene-hero-b" class="hero-layer is-front"></div>
            <canvas id="scene-particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>
          </div>
        </section>
        <section id="room-result" class="gallery-room" aria-label="04 成片">
          <h2 class="room-title sr-only" id="room-result-title" tabindex="-1">04 成片</h2>
          <div id="result-slot" class="room-fill"></div>
        </section>
      </div>
    </div>

    <div id="floating-dock" class="floating-dock"></div>

    <div id="aperture-overlay" class="aperture-overlay" hidden>
      <div class="aperture-inner">
        <div class="aperture-rule" aria-hidden="true"></div>
        <span class="aperture-wordmark">VowMirror</span>
        <div class="aperture-rule" aria-hidden="true"></div>
        <p id="generation-status" class="aperture-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="cancel-generation" class="ivory-pill" type="button" hidden>取消生成</button>
      </div>
    </div>
  </main>

  <dialog id="access-dialog" class="access-dialog" aria-labelledby="access-title"><form id="access-form" class="access-form" novalidate>
    <p class="eyebrow">属于你们的婚礼灵感</p><h2 id="access-title">输入生成码</h2><p>每个生成码累计可成功生成 5 张合影。点击「生成成片」时核验，通过后才调用图像服务。每次生成都需输入，重复使用同一码将沿用剩余额度。</p>
    <label class="field-label" for="access-token">生成码</label><input id="access-token" name="generation-code" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="粘贴你的生成码" aria-describedby="access-hint access-error" required>
    <p id="access-error" class="field-error" role="alert" hidden></p><p id="access-hint" class="field-note">先核验生成码，通过后才上传照片。生成码仅用于本次请求，使用后清空。</p><div class="dialog-actions"><button id="cancel-access" class="ivory-pill" type="button">暂不生成</button><button id="confirm-access" class="charcoal-pill" type="submit">确认并生成</button></div>
  </form></dialog>
</body>
</html>
