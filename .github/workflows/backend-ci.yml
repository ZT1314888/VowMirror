name: Docker foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated Phase 7 acceptance
        shell: pwsh
        run: ./scripts/verify-phase6.ps1 -Stage phase7 -ColdBuild
