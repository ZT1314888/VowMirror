name: vowmirror

services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${VOWMIRROR_WEB_PORT:-3000}:8080"
      - "${VOWMIRROR_HTTPS_BIND:-127.0.0.1}:${VOWMIRROR_HTTPS_PORT:-0}:8443"
    volumes:
      - ${VOWMIRROR_SSL_DIR:-./docker}:/etc/nginx/ssl:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - app

  backend:
    restart: unless-stopped
    stop_grace_period: 110s
    build:
      context: .
      dockerfile: backend/manifest/docker/Dockerfile
    environment:
      TRYON_API_KEYS: ${TRYON_API_KEYS:-}
      TRYON_DAILY_ATTEMPT_LIMIT: ${TRYON_DAILY_ATTEMPT_LIMIT:-10}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
    healthcheck:
      test: ["CMD", "/app/vowmirror", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Fresh checkouts get empty directories; missing images explicitly fail generation.
    # Only controlled outfits, venues and pose line drawings are mounted; private intake stays invisible.
    volumes:
      - usage:/var/lib/vowmirror
      - ./assets/wedding/W001:/assets/wedding/W001:ro
      - ./assets/wedding/W002:/assets/wedding/W002:ro
      - ./assets/wedding/W003:/assets/wedding/W003:ro
      - ./assets/wedding/W004:/assets/wedding/W004:ro
      - ./assets/wedding/W005:/assets/wedding/W005:ro
      - ./assets/wedding/W006:/assets/wedding/W006:ro
      - ./assets/wedding/W007:/assets/wedding/W007:ro
      - ./assets/wedding/W008:/assets/wedding/W008:ro
      - ./assets/wedding/W009:/assets/wedding/W009:ro
      - ./assets/wedding/W010:/assets/wedding/W010:ro
      - ./assets/wedding/W011:/assets/wedding/W011:ro
      - ./assets/wedding/W012:/assets/wedding/W012:ro
      - ./assets/wedding/W013:/assets/wedding/W013:ro
      - ./assets/wedding/W014:/assets/wedding/W014:ro
      - ./assets/wedding/W015:/assets/wedding/W015:ro
      - ./assets/wedding/W016:/assets/wedding/W016:ro
      - ./assets/wedding/W017:/assets/wedding/W017:ro
      - ./assets/wedding/W018:/assets/wedding/W018:ro
      - ./assets/wedding/W019:/assets/wedding/W019:ro
      - ./assets/wedding/W020:/assets/wedding/W020:ro
      - ./assets/wedding/W021:/assets/wedding/W021:ro
      - ./assets/wedding/W022:/assets/wedding/W022:ro
      - ./assets/wedding/W023:/assets/wedding/W023:ro
      - ./assets/wedding/W024:/assets/wedding/W024:ro
      - ./assets/wedding/W025:/assets/wedding/W025:ro
      - ./assets/wedding/W026:/assets/wedding/W026:ro
      - ./assets/wedding/W027:/assets/wedding/W027:ro
      - ./assets/wedding/W028:/assets/wedding/W028:ro
      - ./assets/wedding/W029:/assets/wedding/W029:ro
      - ./assets/wedding/W030:/assets/wedding/W030:ro
      - ./assets/wedding/venues:/assets/wedding/venues:ro
      - ./assets/wedding/poses:/assets/wedding/poses:ro
    networks:
      - app

  tools-backup:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    volumes:
      # SQLite opens the database read-only but may create WAL/SHM metadata after a clean stop.
      - usage:/usage
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700,size=64m
    network_mode: none

  tools-go:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-go.Dockerfile
    working_dir: /workspace/backend
    volumes:
      - .:/workspace:${VOWMIRROR_SOURCE_MODE:-ro}
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["/tools/check-go.sh"]

  tools-node:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-node.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: ["sh", "/workspace/docker/check-node.sh"]

  tools-browser:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-browser.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
      - ${VOWMIRROR_EVIDENCE_DIR:-./.local/browser}:/evidence
    environment:
      SMOKE_BASE_URL: http://web:8080
      SMOKE_EVIDENCE_DIR: /evidence
      TRYON_API_KEYS: ${TRYON_API_KEYS:-}
    networks:
      - app
    shm_size: 256mb
    command: ["node", "tests/smoke.mjs", "--stage", "phase8"]

networks:
  app:
    internal: ${VOWMIRROR_ACCEPTANCE_OFFLINE:-false}
  default:
    internal: ${VOWMIRROR_ACCEPTANCE_OFFLINE:-false}

volumes:
  usage:
  go-mod:
    name: ${VOWMIRROR_GO_MOD_VOLUME:-vowmirror-foundation-go-mod}
  go-build:
    name: ${VOWMIRROR_GO_BUILD_VOLUME:-vowmirror-foundation-go-build}
