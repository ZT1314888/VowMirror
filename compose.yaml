name: vowmirror

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/manifest/docker/Dockerfile
    environment:
      TRYON_API_KEYS: ${TRYON_API_KEYS:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    networks:
      - app

  tools-go:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-go.Dockerfile
    working_dir: /workspace/backend
    volumes:
      - .:/workspace:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["/tools/check-go.sh"]

  tools-node:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-node.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: ["/tools/check-node.sh"]

  tools-browser:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/tools-browser.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      SMOKE_BASE_URL: http://web:8080
    networks:
      - app
    shm_size: 256mb
    command: ["node", "tests/smoke.mjs", "--stage", "foundation"]

networks:
  app:

volumes:
  go-mod:
    name: vowmirror-foundation-go-mod
  go-build:
    name: vowmirror-foundation-go-build
